# Local/test deploy: DMC platform + PostgreSQL.
#
#   docker compose up --build        # whole app at http://localhost:3000
#
# First run, create the platform super-admin (see docs/RUNBOOK.md §7):
#   curl -s -X POST localhost:3000/v1/platform/auth/bootstrap \
#     -H "x-platform-bootstrap: ${PLATFORM_BOOTSTRAP_SECRET:-local-bootstrap-secret}" \
#     -H 'content-type: application/json' \
#     -d '{"email":"root@platform.test","name":"Root","password":"rootpass123"}'
#
# To run ONLY Postgres (e.g. for `npm run start:prisma` on the host):
#   docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dmc
      POSTGRES_PASSWORD: dmc
      POSTGRES_DB: dmc
    ports:
      - '5432:5432'
    volumes:
      - dmc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dmc']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: '3000'
      PERSISTENCE: prisma
      DATABASE_URL: postgresql://dmc:dmc@postgres:5432/dmc?schema=public
      SERVE_WEB: /app/web/dist
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      PLATFORM_BOOTSTRAP_SECRET: ${PLATFORM_BOOTSTRAP_SECRET:-local-bootstrap-secret}
      # Optional real messaging providers (else the logging provider is used):
      # TWILIO_ACCOUNT_SID: ...
      # TWILIO_AUTH_TOKEN: ...
      # GUPSHUP_API_KEY: ...
      # HEYDOOT_API_KEY: ...
    ports:
      - '3000:3000'

volumes:
  dmc-pgdata:
